version: "3.9"

services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    expose:
      - "8000"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - fastapi
